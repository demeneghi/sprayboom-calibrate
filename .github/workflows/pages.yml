# Despliegue automático del sitio a GitHub Pages.
#
# El repositorio ES el sitio: no hay paso de compilación. Este flujo corre
# las pruebas de dominio y, solo si pasan, empaqueta la raíz del repositorio
# y la publica en Pages. Una calibración rota no se publica.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas de dominio (node:test, sin dependencias)
        run: npm test

  desplegar:
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Pages (la primera vez intenta activarlo)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar la raíz del repositorio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
