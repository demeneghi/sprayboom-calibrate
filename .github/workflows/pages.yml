# Despliegue automático del sitio a GitHub Pages.
#
# El repositorio ES el sitio: no hay paso de compilación. Este flujo
# corre la batería completa de validaciones (ci.yml) y, solo si pasa,
# empaqueta la raíz del repositorio y la publica en Pages. Una
# calibración rota no se publica.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    uses: ./.github/workflows/ci.yml

  desplegar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # La primera activación de Pages es manual (Settings, Pages,
      # Source: GitHub Actions): el token del flujo no tiene permiso
      # para crearla. Ya activada, este paso solo lee la configuración.
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar la raíz del repositorio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
