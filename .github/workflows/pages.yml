# Despliegue automático del sitio a GitHub Pages.
#
# El repositorio ES el sitio: no hay paso de compilación. Este flujo
# corre la batería completa de validaciones (ci.yml) y, solo si pasa,
# empaqueta la raíz del repositorio y la publica en Pages. Una
# calibración rota no se publica.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    uses: ./.github/workflows/ci.yml

  desplegar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # La primera activación de Pages es manual (Settings, Pages,
      # Source: GitHub Actions): el token del flujo no tiene permiso
      # para crearla. Ya activada, este paso solo lee la configuración.
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # La versión de la caché la estampa el despliegue, no un pull
      # request. Cada publicación recibe una versión distinta por
      # construcción, así que el teléfono en campo siempre detecta el
      # service worker nuevo; y nadie tiene que acordarse de subir la
      # línea, que era lo que hacía chocar a dos ramas en paralelo.
      - name: Sellar la versión de la caché con la fecha y el commit
        run: |
          node tools/sellar-version.mjs "$(date -u +%Y-%m-%d).${GITHUB_SHA::7}"
          cat version.js
      # Se publica SOLO lo que el sitio sirve, no la raíz del repositorio.
      # La lista sale de precache.js —la misma que precachea el service
      # worker— así que no puede publicarse una ruta que el precache no
      # conozca ni precacharse una que no se publique. Va después del
      # sellado: `version.js` tiene que ir ya estampado.
      - name: Empaquetar solo los archivos del sitio
        run: node tools/empaquetar-sitio.mjs _sitio
      - name: Preparar el artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_sitio
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
