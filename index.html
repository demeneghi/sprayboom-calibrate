<!DOCTYPE html>
<html lang="es-MX" data-theme="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Calibración de aplicaciones agrícolas en cultivo de piña MD2: velocidad y avance, gasto de agua y gas etileno por rotámetro.">
  <meta name="theme-color" content="#0a0a0b">
  <title>Calibración agrícola MD2</title>
  <script>
    // Tema antes del primer pintado, para no parpadear. Default: oscuro.
    (function () {
      var tema = 'oscuro';
      try {
        var crudo = localStorage.getItem('sprayboom.v1');
        if (crudo) {
          var estado = JSON.parse(crudo);
          if (estado && estado.preferencias && estado.preferencias.tema) {
            tema = estado.preferencias.tema;
          }
        }
      } catch (error) { /* modo privado o cuota: se queda el default */ }
      document.documentElement.dataset.theme = tema;
    })();
  </script>
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
</head>
<body>
  <div class="aplicacion">
    <div id="franja-almacen" class="franja-aviso oculto">
      Sin almacenamiento en este navegador: los datos NO se están guardando. Exporta antes de cerrar.
    </div>

    <header class="encabezado">
      <div class="encabezado__fila">
        <div class="selector">
          <label class="visualmente-oculto" for="selector-tractor">Tractor</label>
          <select id="selector-tractor"></select>
        </div>
        <div class="selector">
          <label class="visualmente-oculto" for="selector-equipo">Equipo de aplicacion</label>
          <select id="selector-equipo"></select>
        </div>
        <div class="selector" style="flex: 0 0 6.4rem;">
          <label class="visualmente-oculto" for="selector-unidades">Sistema de unidades</label>
          <select id="selector-unidades">
            <option value="metrico">Métrico</option>
            <option value="imperial">Imperial</option>
          </select>
        </div>
        <button id="boton-compartir" class="boton boton--contorno boton--icono" aria-label="Compartir esta calibración" title="Compartir esta calibración">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="6" cy="12" r="2.6"/><circle cx="17" cy="5.5" r="2.6"/><circle cx="17" cy="18.5" r="2.6"/>
            <path d="M8.4 10.8l6.2-3.9M8.4 13.2l6.2 3.9"/>
          </svg>
        </button>
      </div>
      <div id="subnav"></div>
    </header>

    <main id="panel" class="contenido" role="tabpanel" tabindex="0"></main>

    <nav class="nav-inferior" aria-label="Secciones">
      <button class="nav-inferior__boton" data-seccion="calibrar" aria-current="true">
        <svg class="nav-inferior__icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 3a9 9 0 0 1 9 9h-3a6 6 0 0 0-12 0H3a9 9 0 0 1 9-9z"/>
          <path d="M12 12l4-3"/>
          <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
        </svg>
        Calibrar
      </button>
      <button class="nav-inferior__boton" data-seccion="registrar" aria-current="false">
        <svg class="nav-inferior__icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <rect x="5" y="4" width="14" height="17" rx="2"/>
          <path d="M9 2.5h6v3H9z"/>
          <path d="M8.5 10h7M8.5 13.5h7M8.5 17h4.5"/>
        </svg>
        Registrar
      </button>
      <button class="nav-inferior__boton" data-seccion="sistema" aria-current="false">
        <svg class="nav-inferior__icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/>
        </svg>
        Sistema
      </button>
    </nav>
  </div>

  <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
